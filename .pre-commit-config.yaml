repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: npm run lint:fix
        language: system
        files: \.(js|ts|mjs|astro|md|mdx)$
        pass_filenames: true

      - id: format
        name: format
        entry: npm run format
        language: system
        files: \.(js|ts|mjs|astro|md|mdx)$
        pass_filenames: true
